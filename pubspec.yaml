name: proofit
description: ProofIt — Work Done. Proved Instantly.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^13.0.0

  # HTTP
  dio: ^5.4.0
  http: ^1.6.0

  # Google Sign-In + Drive
  google_sign_in: ^6.2.1
  googleapis: ^12.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # Apple Sign-In
  sign_in_with_apple: ^6.1.4

  # Firebase FCM
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.0.0

  # Camera + Photo
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  image: ^4.1.7
  photo_view: ^0.14.0

  # Location + Maps
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  google_maps_flutter: ^2.6.0
  google_maps_flutter_android: ^2.14.2
  google_maps_flutter_platform_interface: ^2.13.0
  permission_handler: ^11.3.0

  # Storage
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Deep links
  app_links: ^6.1.1

  # Real-time
  socket_io_client: ^2.0.3+1

  # Connectivity
  connectivity_plus: ^6.0.3
  device_info_plus: ^10.1.0

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.67.0
  intl: ^0.19.0
  timeago: ^3.6.1
  path_provider: ^2.1.2
  share_plus: ^12.0.2
  open_file: ^3.3.2
  url_launcher: ^6.2.5
  uuid: ^4.3.3
  collection: ^1.18.0
  package_info_plus: ^8.0.0
  pdf: ^3.11.1
  printing: ^5.13.1

  # Payments
  razorpay_flutter: ^1.3.7

  # App icon + splash
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.9

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  remove_alpha_ios: true

dev_dependencies:
  flutter_lints: ^3.0.0

flutter_native_splash:
  color: "#0A0A0A"
  image: "assets/images/splash_icon.png"
  android: true
  ios: true
  fullscreen: true
  android_12:
    color: "#0A0A0A"
    image: "assets/images/splash_icon.png"
    icon_background_color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
